name: Public protocol regression (synthetic only)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject secrets, private assets and unexpected files
        run: python tools/public_guard.py .
      - name: Install only the clean-room protocol harness
        run: python -m pip install --disable-pip-version-check -e .
      - name: Synthetic binary packet and WebSocket tests
        run: python -m unittest discover -s tests -v
  cpp-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: C++17 isolated packet-size contract
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic cpp/test_frame_contract.cpp -o /tmp/protocol_contract
          /tmp/protocol_contract

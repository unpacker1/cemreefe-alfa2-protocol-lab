[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cemreefe-alfa2-protocol-lab"
version = "0.1.0"
description = "Clean-room GC framing and Alfa2 v12 WebSocket contract regression laboratory"
requires-python = ">=3.10"
dependencies = ["msgpack>=1.0.7,<2"]

[tool.setuptools.packages.find]
where = ["src"]
